name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    with:
      bun-version: "1.3.14"
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # vp pack is a Node CLI that needs Promise.withResolvers (Node 22+).
      # Build under bun before setup-node puts matrix Node on PATH.
      - run: bun run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: |
          node --input-type=module -e "import { encode, UrType } from './dist/index.mjs';
            const s = encode(new Uint8Array([1,2,3]), UrType.parse('test'));
            if (!s.startsWith('ur:test/')) throw new Error(s);"
      - run: |
          node --input-type=module <<'JS'
          import { Ur } from "./dist/typed.mjs";
          import { encode, UrType, UrError } from "./dist/index.mjs";
          const ur = Ur.create("test", [1, 2, 3]);
          if (ur.string() !== "ur:test/lsadaoaxjygonesw") throw new Error(ur.string());
          const hello = encode(new TextEncoder().encode("hello"), UrType.bytes());
          try { Ur.fromUrString(hello); throw new Error("expected throw"); }
          catch (e) {
            if (!(e instanceof UrError) || e.code !== "CborDecode") throw e;
          }
          JS
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from "node:fs";
          const typed = readFileSync("./dist/typed.mjs", "utf8");
          if (!typed.includes("@blockchaincommons/dcbor")) {
            throw new Error("typed.mjs must import @blockchaincommons/dcbor");
          }
          if (!/\bfrom\s*["']@blockchaincommons\/dcbor["']/.test(typed)) {
            throw new Error("typed.mjs must keep dcbor as an external from-import");
          }
          if (typed.includes("function decodeCbor") || typed.includes("CborError.underrun")) {
            throw new Error("typed.mjs inlined dcbor source");
          }
          for (const name of readdirSync("./dist").filter((n) => n.endsWith(".mjs"))) {
            if (name === "typed.mjs") continue;
            const body = readFileSync(`./dist/${name}`, "utf8");
            if (body.includes("@blockchaincommons/dcbor")) {
              throw new Error(`${name} must not import @blockchaincommons/dcbor`);
            }
          }
          const pkg = JSON.parse(readFileSync("./package.json", "utf8"));
          if (pkg.engines?.node !== ">=22.12") {
            throw new Error(`engines.node must be >=22.12, got ${JSON.stringify(pkg.engines)}`);
          }
          const pm = pkg.devEngines?.packageManager;
          if (pm?.name !== "bun" || pm?.version !== "1.3.14" || pm?.onFail !== "ignore") {
            throw new Error(
              `devEngines.packageManager must be bun@1.3.14 onFail=ignore (npm 11 publish), got ${JSON.stringify(pm)}`,
            );
          }
          for (const key of [".", "./typed"]) {
            const exp = pkg.exports[key];
            if (typeof exp !== "object" || exp === null) {
              throw new Error(`${key} export must be an object map, got ${JSON.stringify(exp)}`);
            }
            if (!exp.types || !exp.import || !exp.default) {
              throw new Error(`${key} export missing types/import/default`);
            }
          }
          JS
      - if: matrix.node == '24'
        run: npm publish --dry-run --access public
