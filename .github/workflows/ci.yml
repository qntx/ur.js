name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    with:
      bun-version: "1.3.14"
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: |
          node --input-type=module -e "import { encode, UrType } from './dist/index.mjs';
            const s = encode(new Uint8Array([1,2,3]), UrType.parse('test'));
            if (!s.startsWith('ur:test/')) throw new Error(s);"
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, sys
          root = Path("docs")
          meta_path = root / "meta.json"
          if not meta_path.is_file():
              sys.exit("missing docs/meta.json")
          meta = json.loads(meta_path.read_text())
          if not isinstance(meta.get("title"), str) or not meta["title"]:
              sys.exit("meta.json title")
          if not isinstance(meta.get("pages"), list):
              sys.exit("meta.json pages")
          if meta.get("root") not in (None, False):
              sys.exit("library docs must not set root:true")
          missing = []
          for p in root.rglob("*.mdx"):
              body = p.read_text()
              if not body.startswith("---"):
                  missing.append(str(p)); continue
              fm = body.split("---", 2)[1]
              if "title:" not in fm or "description:" not in fm:
                  missing.append(str(p))
          if missing:
              sys.exit("frontmatter title/description required: " + ", ".join(missing))
          print("docs ok")
          PY
